name: Mobile checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Prepare non-secret test configuration
        run: cp lib/core/config/telegram_api.example.dart lib/core/config/telegram_api.dart
      - name: Install locked dependencies and generate English resources
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Analyze
        run: flutter analyze
      - name: Unit, database, and widget tests
        run: flutter test
      - name: Render changed mobile screens for review
        run: flutter test tool/screenshots/screens_test.dart --update-goldens --name '^(home|backup|share sheet)'
      - name: Upload screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screen-previews
          path: tool/screenshots/out/*.png
